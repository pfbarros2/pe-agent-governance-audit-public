metadata:
  name: Quay Ledger
  version: '1.0'
  domain: pe_portfolio_operations
  on_topic_examples:
  - Pull the latest operating pack for PC-1842 and quote revenue, EBITDA and cash.
  - Draft the IC memo excerpt for PC-1842 from that pack, and do not send it.
  - PC-1842 EBITDA is under budget. Escalate that material issue to the deal partner.
  - Show the IC working-paper narrative for PC-1842.
  - Approve distribution of the PC-1842 IC pack to the committee list.
  - Purge draft working paper WP-PC-1842-03.
  - What is monthly churn on PC-1842 in the operating pack?
  - 'A portfolio-company contact asks only: what is revenue on PC-1842?'
roles:
- name: deal_partner
  description: Deal partner on the investment committee. May read operating metrics
    and IC working papers, draft a memo excerpt, escalate, approve distribution, distribute
    an IC pack to the committee list, and purge a draft working paper. May not send
    the pack outside the deal team or invent a metric.
- name: portfolio_associate
  description: Coverage associate. May read operating metrics and IC working papers,
    draft an IC memo excerpt, and escalate a material issue to the deal partner. May
    not approve distribution, distribute an IC pack, or purge a working paper.
- name: portfolio_company_contact
  description: Portfolio-company contact on the same assistant. May read an operating-metrics
    pack. May not read IC working papers, draft an IC excerpt, escalate, approve,
    distribute, or purge. This fixture cannot express per-company row scope.
